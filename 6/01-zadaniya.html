<!-- ============================================================
     УПРАЖНЕНИЕ 5. КРОССВОРД
     ============================================================ -->
<div data-type="crossword">
  <div class="cw-wrap">

    <div class="cw-header">
      <h3>📝 Упражнение 5. Кроссворд</h3>
      <p>Впиши буквы в клетки. Слова пересекаются друг с другом.</p>
    </div>

    <div class="cw-grid" id="cwGrid"></div>

    <div class="cw-clues">
      <div class="cw-col">
        <h4>По горизонтали</h4>
        <ol id="cwAcross"></ol>
      </div>
      <div class="cw-col">
        <h4>По вертикали</h4>
        <ol id="cwDown"></ol>
      </div>
    </div>

    <div class="cw-buttons">
      <button class="btn check" id="cwCheck" type="button">✅ Проверить</button>
      <button class="btn show" id="cwShow" type="button">👀 Показать ответ</button>
    </div>

    <div class="result-box" id="cwResult"></div>
  </div>

  <script>
  (function () {
    // ============================================================
    // СЕТКА КРОССВОРДА 12×12
    // Слова: ДАННЫЕ, ЯСНОСТЬ, ИНФОРМАТИКА, ПОЛНОТА, ТЕХНОЛОГИИ, ИНФОРМАЦИЯ
    // Пересечения с ИНФОРМАТИКА.
    // ============================================================
    const SIZE = 12;

    const WORDS = [
      // --- ГОРИЗОНТАЛЬ ---
      { id: 1, word: 'ИНФОРМАТИКА', row: 2, col: 0, dir: 'h',
        clue: 'Наука, изучающая методы создания, представления, хранения, передачи, обработки и использования информации' },

      // --- ВЕРТИКАЛЬ ---
      { id: 2, word: 'ДАННЫЕ', row: 0, col: 1, dir: 'v',
        clue: 'Сведения, представленные на одном из формальных языков' },
      { id: 3, word: 'ПОЛНОТА', row: 1, col: 3, dir: 'v',
        clue: 'Свойство информации: всестороннее отражение сведений о предмете или явлении' },
      { id: 4, word: 'ЯСНОСТЬ', row: 0, col: 8, dir: 'v',
        clue: 'Свойство информации: форма, доступная для восприятия' },
      { id: 5, word: 'ТЕХНОЛОГИИ', row: 2, col: 7, dir: 'v',
        clue: 'Технологии работы с данными, основанные на применении компьютеров' },
      { id: 6, word: 'ИНФОРМАЦИЯ', row: 2, col: 0, dir: 'v',
        clue: 'Сведения об объектах и событиях окружающего мира' }
    ];

    // Строим карту: "r,c" → { letter, wordId }
    const cells = {};
    WORDS.forEach(function (w) {
      for (let i = 0; i < w.word.length; i++) {
        const r = w.dir === 'h' ? w.row     : w.row + i;
        const c = w.dir === 'h' ? w.col + i : w.col;
        if (r >= SIZE || c >= SIZE) return;
        cells[r + ',' + c] = { letter: w.word[i] };
      }
    });

    // Рисуем сетку
    const gridEl = document.getElementById('cwGrid');
    gridEl.style.gridTemplateColumns = 'repeat(' + SIZE + ', 1fr)';

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const cell = cells[r + ',' + c];
        const div = document.createElement('div');
        div.className = 'cw-cell';

        if (cell) {
          div.classList.add('cw-active');
          const input = document.createElement('input');
          input.type = 'text';
          input.maxLength = 1;
          input.dataset.answer = cell.letter;
          input.autocomplete = 'off';
          input.addEventListener('input', function () {
            this.value = this.value.replace(/[^А-ЯЁа-яё]/g, '').toUpperCase();
            // Автопереход
            const all = gridEl.querySelectorAll('.cw-cell input');
            const idx = Array.from(all).indexOf(this);
            if (this.value && idx + 1 < all.length) all[idx + 1].focus();
          });
          input.addEventListener('focus', function () { this.select(); });
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Backspace' && !this.value) {
              const all = gridEl.querySelectorAll('.cw-cell input');
              const idx = Array.from(all).indexOf(this);
              if (idx > 0) { all[idx - 1].focus(); all[idx - 1].value = ''; }
            }
          });
          div.appendChild(input);
        } else {
          div.classList.add('cw-empty');
        }
        gridEl.appendChild(div);
      }
    }

    // Подсказки
    const acrossEl = document.getElementById('cwAcross');
    const downEl = document.getElementById('cwDown');
    let nAcross = 0, nDown = 0;

    WORDS.forEach(function (w) {
      const li = document.createElement('li');
      if (w.dir === 'h') {
        nAcross++;
        li.innerHTML = '<b>' + nAcross + '.</b> ' + w.clue;
        acrossEl.appendChild(li);
      } else {
        nDown++;
        li.innerHTML = '<b>' + nDown + '.</b> ' + w.clue;
        downEl.appendChild(li);
      }
    });

    // Кнопка «Проверить»
    document.getElementById('cwCheck').addEventListener('click', function () {
      const all = gridEl.querySelectorAll('.cw-cell input');
      let correct = 0;
      all.forEach(function (input) {
        const answer = input.dataset.answer;
        const value = (input.value || '').toUpperCase();
        input.classList.remove('cw-correct', 'cw-wrong');
        if (value === answer) {
          input.classList.add('cw-correct');
          correct++;
        } else {
          input.classList.add('cw-wrong');
        }
      });
      const total = all.length;
      const result = document.getElementById('cwResult');
      if (correct === total) {
        result.className = 'result-box good show';
        result.textContent = '🎉 Молодец! Все буквы верны! (' + correct + '/' + total + ')';
        if (typeof markDone === 'function') markDone('ex5');
      } else {
        result.className = 'result-box bad show';
        result.textContent = '📝 Правильных букв: ' + correct + ' из ' + total + '. Красные — неверные.';
      }
    });

    // Кнопка «Показать ответ»
    document.getElementById('cwShow').addEventListener('click', function () {
      const all = gridEl.querySelectorAll('.cw-cell input');
      all.forEach(function (input) {
        input.value = input.dataset.answer;
        input.classList.remove('cw-wrong');
        input.classList.add('cw-correct');
      });
      const result = document.getElementById('cwResult');
      result.className = 'result-box info show';
      result.textContent = '👀 Все ответы показаны. Постарайся запомнить!';
      if (typeof markDone === 'function') markDone('ex5');
    });
  })();
  </script>

  <style>

     СТИЛИ КРОССВОРДА (изолированы через .cw- префикс)
     ============================================================ */

  @media (max-width: 640px) {

  }
  </style>
</div>
